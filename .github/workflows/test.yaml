name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: pytest (HA ${{ matrix.homeassistant }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            requirements: requirements_test_min.txt
            homeassistant: "minimum (2025.4.4)"
          - python-version: "3.13"
            requirements: requirements_test.txt
            homeassistant: "current"
          - python-version: "3.14"
            requirements: requirements_test.txt
            homeassistant: "current"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}

      - name: Run pytest
        run: pytest tests/ -q
